spring.application.name=payout-batch

# In-memory H2 (the assessment allows it). DB_CLOSE_DELAY keeps it alive for the JVM lifetime.
# LOCK_TIMEOUT: workers and the cancel transaction briefly wait on each other's row locks.
spring.datasource.url=jdbc:h2:mem:treasuryone;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=30000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=24
spring.h2.console.enabled=true

# Schema and seed data are plain SQL scripts run at startup.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql

# Line processing: one fixed-size pool for all batches
payout.worker-threads=16

# Partner switch limits and retry policy (the gateway enforces these across ALL batches)
payout.partner.max-requests-per-second=50
payout.partner.max-in-flight=10
payout.partner.max-attempts=4
payout.partner.backoff-base-ms=200
payout.partner.backoff-max-ms=3000
